services:
  auditor:
    build: .
    image: host-security-auditor:latest
    container_name: host-security-auditor
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=:8080
      # Для TextGen / LM Studio на хосте: http://host.docker.internal:5000/v1
      # Для Ollama на хосте: http://host.docker.internal:11434/v1 (или http://host.docker.internal:11434/api/chat)
      - LLM_ENDPOINT=http://host.docker.internal:5000/v1
      - LLM_PROVIDER=openai
      - LLM_MODEL=qwen2.5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    restart: unless-stopped
